<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mittho MoMo — Order Fresh Homemade Momos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header">
    <img src="images/logo.png" alt="Mittho MoMo logo" class="logo" width="120" height="120">
    <h1 class="visually-hidden">Mittho MoMo — Order Fresh Homemade Momos</h1>
    <p class="devanagari">म:म:</p>
  </header>

  <!-- JS fills this in Phase 7 -->
  <div id="order-status" class="status-banner"></div>

  <main>

    <section id="menu-section">
      <h2>Our Menu</h2>
      <!-- JS builds the cards here in Phase 2 -->
      <div id="menu-list"></div>
    </section>

    <section id="summary-section">
      <h2>Your Order</h2>
      <div id="cart-lines"></div>
      <p class="total">Total: Rs <span id="cart-total">0</span></p>
    </section>

    <section id="details-section">
      <h2>Your Details</h2>

      <label for="customer-name">Name</label>
      <input type="text" id="customer-name" name="name" required>

      <label for="wing">Wing</label>
        <select id="wing" name="wing" required>
            <option value="">Select wing</option>
            <option value="A">A Wing</option>
            <option value="B">B Wing</option>
            <option value="C">C Wing</option>
            <option value="D">D Wing</option>
            <option value="E">E Wing</option>
        </select>

      <label for="flat">Flat number</label>
      <input type="text" id="flat" name="flat" required>

      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="notes">Notes (optional)</label>
      <textarea id="notes" name="notes" rows="2"></textarea>

    </section>

    <button type="button" id="submit-order">Send Order on WhatsApp</button>

  </main>

  <footer>
    <p class="utensil-note">
      <strong>Veg and Non-Veg are cooked separately</strong> — separate utensils, separate preparation, every time.
    </p>
    <p>Questions? <a class="wa-link" href="https://wa.me/918104234623" target="_blank" rel="noopener">WhatsApp +91 81042 34623</a></p>
  </footer>

  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>
  <script src="js/menu.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
